# Arm "signal": main + the learning-signal fixes from docs/NEXT_ROUND.md.
extends: main.yaml

# Train the policy on the MCTS visit distribution, weighted like the value heads.
policy_target: visits
loss_weights:
  policy: 1.0
  value: 1.0
  value_q: 1.0
  mlh: 0.05
  mlh_q: 0.05

# MCTS uses the heads trained on game results / true plies left. main searched
# with value_q / mlh_q, trained only on the search's own backups: ~uniform
# targets under an untrained net (98.7% with max prob < 0.4), a fixed point
# grounded only by mates found inside the tree.
search_heads: outcome

selfplay:
  # Sample moves only in the first 30 plies (AlphaZero), then play the best move.
  temperature_plies: 30
  temperature_late: 0.0
  # Resign below 5% expected score for 3 own moves; 10% of games never resign
  # and measure the false-positive rate.
  resign_threshold: 0.05
  resign_consecutive: 3
  resign_playthrough: 0.1
  # Playout-cap randomization: 25% full 800-sim searches (recorded), 75% cheap
  # 100-sim moves that only advance the game.
  pcr_full_prob: 0.25
  pcr_fast_simulations: 100
  # Ring buffer so the trainer can sample a window over the newest data.
  fifo_buffer: true

data:
  # KataGo-style window: starts at 250k records, grows sublinearly.
  window_c: 250000
  window_alpha: 0.75
  window_beta: 0.4
  min_samples_to_start: 50000
