# Branch of the encoder arm at its plateau (step ~45k, 19.5 h): only the LR changes.
#   box.sh resume-with encoder configs/encoder_decay.yaml
# The arm trained at a constant 1e-3 for 45k steps; its policy loss has been flat
# since ~12k. Cosine 1e-3 -> 5e-5 over 8k steps (~3.5 h), then held at 5e-5.
# If the plateau is the constant-LR noise floor, Elo moves within hours; if it
# is capacity, it doesn't (encoder_final grows the net instead).
extends: encoder.yaml
lr_schedule:
  kind: cosine
  start_step: -1  # = the step this config is resumed at
  warmup_steps: 0
  hold_steps: 0
  total_steps: 8000
  final_ratio: 0.05
