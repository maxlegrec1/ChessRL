# Arm "encoder": the signal arm with the small transformer instead of the ResNet.
# Transformers are less forgiving of a constant 1e-3 Adam LR from step 0, so this
# arm adds a 1,000-step warmup and gradient clipping.
extends: signal.yaml
model:
  arch: encoder
  d_model: 128
  layers: 4
  heads: 8
  d_ff: 256
lr_schedule:
  kind: constant
  warmup_steps: 1000
grad_clip: 1.0
