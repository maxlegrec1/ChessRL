# Final run: continue the encoder arm from its 24 h checkpoint.
#   box.sh resume-with encoder configs/encoder_final.yaml
# - Growth on ladder plateaus (< 50 Elo gained over 2 h since the last growth):
#   4 -> 6 layers (the arm has hovered at ~1,800 since ~8 h, so likely right
#   away), then 6 -> 8 on the next plateau. Function-preserving.
# - LR constant for 18k steps after the resume, then cosine to 5% by 30k.
# - Resignation auto-calibrated to <= 5% wrong resignations (a fixed 5%
#   threshold measured 7.1-7.4% wrong in every arm).
extends: encoder.yaml
selfplay:
  resign_target_fp: 0.05
growth:
  trigger: plateau
  plateau_hours: 2.0
  plateau_min_gain: 50
  schedule:
    - [0, 6]
    - [0, 8]
  lr_rewarmup_steps: 500
lr_schedule:
  kind: cosine
  start_step: -1  # = the step this config is resumed at
  warmup_steps: 0
  hold_steps: 18000
  total_steps: 30000
  final_ratio: 0.05
