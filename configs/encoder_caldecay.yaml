# Branch of the encoder arm at step 45.5k: resignation calibration + LR decay, no growth.
# encoder_decay (fixed 0.05 threshold) lost ~180 Elo in 2.5k steps while its value
# loss rose (wrong resignations 11.3%); the calibrated branches held. This asks
# whether LR decay helps once the value targets are clean. Compare with
# encoder_resigncal (calibration only) and encoder_final (calibration + growth).
extends: encoder.yaml
selfplay:
  resign_target_fp: 0.05
lr_schedule:
  kind: cosine
  start_step: -1  # = the step this config is resumed at
  warmup_steps: 0
  hold_steps: 0
  total_steps: 8000
  final_ratio: 0.05
