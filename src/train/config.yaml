device: cuda
batch_size: 1024
learning_rate: 0.001
weight_decay: 0.0
beta1: 0.9
beta2: 0.999
log_every: 1
amp_dtype: float16
run_name: null
teacher_decay: 0.8
teacher_weight: 0.2

checkpoint:
  dir: artifacts/checkpoints
  every_steps: 100
  keep_last: 999999
  build_script: scripts/build_trt.sh
  engine_dir: artifacts/engines
  iteration_file: artifacts/engines/.iteration

data:
  dataset_path: artifacts/buffers/buffer.bin
  reload_seconds: 20
  # Half of selfplay.max_buffer_size below — wait until the replay buffer is
  # half full before training starts, so the first batches are drawn from
  # diverse data and the steady-state samples-per-insertion ratio is the
  # constraint rather than the initial transient.
  min_samples_to_start: 100000
  warmup_poll_seconds: 5
  # Trainer pacing: each record gets sampled this many times on average over its
  # buffer lifetime. Sleep auto-adjusts to track the live self-play rate.
  target_k: 5.0

selfplay:
  boards: 1024
  # MCTS worker threads. With virtual-loss batched descent (width>1) each
  # thread holds W leaves in flight, so fewer threads is better: the bench
  # sweep on the 4090 found width=8 + threads=128 → 347 pos/sec, beating
  # threads=256 (293) — larger thread counts inflate per-batch latency.
  # 0 = legacy hardcoded 256.
  threads: 128
  # 0 disables the TT entirely. Profile measured ~1.5% hit rate during
  # self-play (with random-opening plies), making the per-leaf lock+hash
  # overhead net-negative. Re-enable (e.g. 4096) only if hit rate climbs.
  hash_size: 0
  simulations: 800
  cpuct: 0.65
  temperature: 1.3
  temperature_at_root: 1.0
  # Virtual-loss batched-descent width. 1 = legacy strict-sequential MCTS
  # (search quality every existing model was trained on, ~168 pos/sec).
  # 8 = throughput knee on the 4090 (~356 pos/sec steady-state, 2.1×) at
  # the cost of blurrier search. Off-knee widths buy little (w=48 only
  # ~356 too, but Elo craters). This is a NEW quality/throughput tradeoff
  # — pre-overhaul self-play always ran at the width=1 equivalent.
  virtual_loss_width: 8
  use_dirichlet: true
  dirichlet_alpha: 0.12
  dirichlet_epsilon: 0.05
  max_buffer_size: 1000000
  flush_interval: 1
  poll_seconds: 300
  save_pgn: false
  pgn_dir: artifacts/pgns
  # Optional: play N uniform-random legal plies at the start of each game for
  # opening diversity (0 disables; current behavior). A small positive value
  # like 4-8 dramatically increases the fraction of buffer records with
  # converged MCTS WDL signal.
  random_opening_plies: 8

loss_weights:
  # Coefficients on each head's loss in total_loss.
  # Defaults preserve the previously hardcoded recipe.
  policy: 0.1
  value: 1.0
  value_q: 1.0
  mlh: 0.05
  mlh_q: 0.05

wandb:
  project: self_play
  entity: null
  run_name: null
  enabled: true
