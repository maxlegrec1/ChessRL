# The training recipe: what `python -m src.run` uses for a new run. The run directory keeps a
# copy (artifacts/runs/<id>/config.yaml), which --resume reads. Every setting the recipe uses
# is written out: a key missing here falls back to the dataclass default in config.py (older
# values, not this recipe). The keys left out are optional features that stay off: growth,
# the cosine schedule, resign-threshold calibration, torch.compile. Reference: docs/CONFIG.md.

device: cuda
batch_size: 2048
learning_rate: 0.001
optimizer: adamw
# Decoupled weight decay, on weight matrices only (norms, biases and gains are exempt). It
# keeps the encoder's activations well inside FP16 range.
weight_decay: 0.05
beta1: 0.9
beta2: 0.999
grad_clip: 1.0
lr_schedule:
  kind: constant
  warmup_steps: 1000
amp_dtype: float16
mirror_prob: 0.5 # colour-flip augmentation
log_every: 5

model:
  arch: encoder # transformer, one token per square: 0.81M parameters
  d_model: 128
  layers: 4
  heads: 8
  d_ff: 256

# The policy learns the search's visit counts. The search reads the value and moves-left
# heads trained on game results, not the ones trained on its own backed-up estimates.
policy_target: visits
search_heads: outcome
loss_weights:
  policy: 1.0
  value: 1.0
  value_q: 1.0
  mlh: 0.05
  mlh_q: 0.05

checkpoint:
  dir: artifacts/checkpoints
  # A checkpoint and a new network (.cnet) every 500 steps. The export runs in the
  # background (async_engine_build) and self-play loads it without restarting.
  every_steps: 500
  keep_last: 999999
  build_script: scripts/build_net.sh
  engine_dir: artifacts/engines
  iteration_file: artifacts/engines/.iteration
async_engine_build: true

data:
  dataset_path: artifacts/buffers/buffer.bin
  min_samples_to_start: 50000
  warmup_poll_seconds: 5
  # Pacing: the trainer samples each record about target_k times on average.
  target_k: 5.0
  # Sample from a window over the newest records that grows with the data (KataGo):
  # W(N) = c * (1 + beta * ((N / c) ** alpha - 1) / alpha). Needs selfplay.fifo_buffer.
  window_c: 250000
  window_alpha: 0.75
  window_beta: 0.4

selfplay:
  boards: 1024
  # Fewer threads batch better with virtual-loss width 8 (128 measured faster than 256).
  threads: 128
  hash_size: 0 # transposition table off: ~1.5% hit rate, not worth the locking
  # Playout-cap randomisation: 25% of moves get a full 400-simulation search and are saved
  # for training; the others get 50 simulations and only move the game forward.
  simulations: 400
  pcr_full_prob: 0.25
  pcr_fast_simulations: 50
  # Tree reuse (off until measured on a GPU): keep the played move's subtree for the next
  # search, which then runs only the simulations its root is missing.
  tree_reuse: false
  cpuct: 0.65
  temperature: 1.3 # prior temperature inside the tree
  # Moves are sampled from the visit counts for the first 30 searched plies; after that the
  # most visited move is played.
  temperature_at_root: 1.0
  temperature_plies: 30
  temperature_late: 0.0
  # Virtual-loss width: each thread collects 8 leaves per network call (bigger GPU batches,
  # slightly blurrier search). 1 = strictly sequential search.
  virtual_loss_width: 8
  use_dirichlet: true
  dirichlet_alpha: 0.3 # AlphaZero's chess values, on full searches only
  dirichlet_epsilon: 0.25
  # Uniform-random plies at the start of every game, for opening variety.
  random_opening_plies: 8
  # Resign below 5% expected score for 3 own moves in a row. 10% of games never resign,
  # to measure how often resigning would have been wrong.
  resign_threshold: 0.05
  resign_consecutive: 3
  resign_playthrough: 0.1
  max_plies: 600
  # Ring buffer: 2M records x 1,280 bytes = 2.6 GB, the oldest records overwritten first.
  max_buffer_size: 2000000
  fifo_buffer: true
  poll_seconds: 300
  save_pgn: false
  pgn_dir: artifacts/pgns

wandb:
  enabled: false # metrics go to <run>/metrics/*.jsonl, which the dashboard reads
  project: self_play
  entity: null
