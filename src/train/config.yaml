# The training recipe: what `python -m src.run` uses for a new run. The run directory keeps a
# copy (artifacts/runs/<id>/config.yaml), which --resume reads. Every setting the recipe uses
# is written out: a key missing here falls back to the dataclass default in config.py (older
# values, not this recipe). The keys left out are optional features that stay off: growth,
# the cosine schedule, resign-threshold calibration, torch.compile. Reference: docs/CONFIG.md.

device: cuda
batch_size: 2048
learning_rate: 0.001
optimizer: adamw
# Decoupled weight decay, on weight matrices only (norms, biases and gains are exempt). It
# keeps the encoder's activations well inside FP16 range.
weight_decay: 0.05
beta1: 0.9
beta2: 0.999
grad_clip: 1.0
# Flat for the first 70k steps (~2 h on an RTX 4090 + Ryzen 7950X, ~35k steps/h), then a cosine
# down to a tenth by step 280k (~8 h), and a tenth after that. The decay is what carries a run past
# the ~2,300-2,400 plateau of a constant rate (docs/RESULTS.md). It counts steps, so a
# longer run should stretch total_steps.
lr_schedule:
  kind: cosine
  warmup_steps: 1000
  hold_steps: 70000
  total_steps: 280000
  final_ratio: 0.1
amp_dtype: float16
# torch.compile the network for training: the step is memory-bound element-wise work (norms,
# attention scores) that compiling fuses, 3 times faster. The first
# step compiles, about a minute.
compile: true
# FP16 accumulators in the trainer's matrix multiplies, as in the self-play kernel: the same speed
# and losses at this size, twice the tensor-core rate for a bigger model.
fp16_accumulation: true
# The encoder's residual stream in FP16 during training: half its traffic, rounding noise of the
# same size as the FP16 matrix multiplies already add.
fp16_residual: true
log_every: 5

model:
  arch: encoder # transformer, one token per square: 0.81M parameters
  d_model: 128
  layers: 4
  heads: 8
  d_ff: 256
  # Input plane 104 carries the real side to move (1 White, 0 Black) instead of a constant 1: the network's only
  # sign that it plays the black pieces, since positions are mirrored so that the side to move plays white.
  stm_plane: colour
  # INT8 training and INT8 networks for self-play (the fused kernel's INT8 path, +30% over FP16 on v3). With the
  # search fixes, self-play recorded 4,800 positions/s in the 8-hour run against 3,980 in FP16 on the same box.
  int8: true

# The policy learns the search's visit counts. The search reads the value and moves-left
# heads trained on game results, not the ones trained on its own backed-up estimates.
policy_target: visits
search_heads: outcome
loss_weights:
  policy: 1.0
  value: 1.0
  value_q: 1.0
  mlh: 0.05
  mlh_q: 0.05

checkpoint:
  dir: artifacts/checkpoints
  # A checkpoint and a new network (.cnet) every 500 steps. The export runs in the
  # background (async_engine_build) and self-play loads it without restarting.
  every_steps: 500
  keep_last: 999999
  build_script: scripts/build_net.sh
  engine_dir: artifacts/engines
  iteration_file: artifacts/engines/.iteration
async_engine_build: true
# Self-play and the trainer share the GPU through NVIDIA MPS: their kernels run side by side
# (1,964 records/s against 1,327 taking turns). The launcher falls back to no MPS
# where it fails.
mps: true

data:
  dataset_path: artifacts/buffers/buffer.bin
  min_samples_to_start: 50000
  warmup_poll_seconds: 5
  # Pacing: the trainer samples each record about target_k times on average.
  target_k: 5.0
  # Sample from a window over the newest records that grows with the data (KataGo):
  # W(N) = c * (1 + beta * ((N / c) ** alpha - 1) / alpha). Needs selfplay.fifo_buffer.
  window_c: 250000
  window_alpha: 0.75
  window_beta: 0.4

selfplay:
  boards: 1024
  # Fewer threads batch better with virtual-loss width 8 (128 measured faster than 256).
  threads: 128
  # Each search thread plays its own boards in turn with no step barrier, so the GPU never waits
  # for a step's last searches (+20% recorded positions/s).
  async_play: true
  hash_size: 0 # transposition table off: ~1.5% hit rate, not worth the locking
  # Playout-cap randomisation: 25% of moves get a full 400-simulation search and are saved
  # for training; the others get 50 simulations and only move the game forward.
  simulations: 400
  pcr_full_prob: 0.25
  pcr_fast_simulations: 50
  # Tree reuse: keep the played move's subtree for the next search, which then runs only
  # the simulations its root is missing (+33% recorded positions/s).
  tree_reuse: true
  cpuct: 0.65
  temperature: 1.3 # prior temperature inside the tree
  # Every game starts from the initial position, and its first 40 searched plies are sampled from
  # the visit counts: the full searches at temperature 1 (with Dirichlet noise), the fast ones at
  # 0.7, since their 50-simulation visit counts are flat (~11 effective moves against the policy's
  # ~6) and sampling them at 1 plays many weak moves. After that the most visited move is played.
  # Openings sampled this way stayed varied over 8 hours (6-7 effective first moves, ~4,400
  # distinct positions at ply 8 in 400k records); round 2's run C, which drew its fast moves from
  # the raw policy at 0.7, collapsed onto 1.e4 (docs/RESULTS.md).
  temperature_at_root: 1.0
  temperature_plies: 40
  temperature_late: 0.0
  fast_temperature_at_root: 0.7
  # Virtual-loss width: each thread collects 8 leaves per network call (bigger GPU batches,
  # slightly blurrier search). 1 = strictly sequential search.
  virtual_loss_width: 8
  use_dirichlet: true
  dirichlet_alpha: 0.3 # AlphaZero's chess values, on full searches only
  dirichlet_epsilon: 0.25
  # No uniformly random plies: the openings come from the sampled plies above.
  random_opening_plies: 0
  # Resign below 5% expected score for 3 own moves in a row. 10% of games never resign,
  # to measure how often resigning would have been wrong.
  resign_threshold: 0.05
  resign_consecutive: 3
  resign_playthrough: 0.1
  max_plies: 600
  # Ring buffer: 6M records x 1,280 bytes = 7.7 GB, the oldest records overwritten first. The
  # sampling window (data.window_*) grows past 2M records by hour ~1; capping it at 2M (8 minutes
  # of self-play) let the value head overfit the newest games (+50 to +100 Elo with 6M).
  max_buffer_size: 6000000
  fifo_buffer: true
  poll_seconds: 300
  save_pgn: false
  pgn_dir: artifacts/pgns
