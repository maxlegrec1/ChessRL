name: lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ruff:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install ruff
        run: uv tool install ruff
      # No --group dev sync needed — ruff is run via uv tool, not the project's
      # venv. This skips the heavy C++/CUDA build for a lint-only check.
      - name: ruff check
        run: uv tool run ruff check src scripts tests
      - name: ruff format --check
        run: uv tool run ruff format --check src scripts tests
