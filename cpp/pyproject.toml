[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chessrl-inference-cpp"
version = "0.1.0"
description = "Pybind11 bindings for the ChessRL TensorRT inference engine"
requires-python = ">=3.13"

[tool.setuptools]
py-modules = []

# Rebuild the extension whenever a C++/CUDA source changes (uv's default
# cache keys only watch the packaging files).
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "*.cpp" },
    { file = "*.hpp" },
    { file = "include/*.hpp" },
    { file = "mcts/*" },
]
